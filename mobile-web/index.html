<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BALI Academy">
<meta name="theme-color" content="#08090b">
<title>BALI Academy</title>
<style>
:root{--bg:#08090b;--panel:#111419;--line:#252a31;--muted:#929aa6;--accent:#e7ff63;--danger:#ff7474;color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090b;color:#fff}body{min-height:100vh;background:radial-gradient(circle at 80% 0,#172014 0,#08090b 36%);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}.wrap{max-width:760px;margin:auto;padding:24px 18px 112px}.brand{font-weight:950;letter-spacing:5px;color:var(--accent);font-size:30px}.sub,.muted{color:var(--muted)}.card{background:linear-gradient(180deg,#15181d,#0f1114);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}.field{display:grid;gap:8px;margin:15px 0}.field label{font-size:12px;color:var(--muted);font-weight:800}.field input,.field select,.field textarea{width:100%;background:#0c0e11;border:1px solid var(--line);border-radius:14px;color:#fff;padding:14px}.roles,.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role,.tile{border:1px solid var(--line);background:#111419;color:#fff;border-radius:16px;padding:16px;text-align:left}.role.active{border-color:#9eaf49;background:#182013}.primary{width:100%;border:0;border-radius:14px;padding:15px;background:var(--accent);color:#0b0c0e;font-weight:950}.ghost{border:1px solid var(--line);background:#111419;color:#fff;border-radius:12px;padding:11px 14px}.tile{min-height:118px}.tile b{display:block;font-size:17px}.tile span{display:block;color:var(--muted);font-size:12px;margin-top:7px;line-height:1.35}.nav{position:fixed;left:0;right:0;bottom:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#090b0ef0;backdrop-filter:blur(18px);border-top:1px solid #20242a}.nav button{border:0;background:transparent;color:#9aa1aa;padding:10px 4px;font-size:11px}.nav button.active{color:var(--accent)}h1{font-size:30px;margin:18px 0 8px}h2{font-size:21px}.score{font-size:46px;font-weight:950;color:var(--accent)}.question{font-size:21px;font-weight:850;line-height:1.3}.option{width:100%;text-align:left;padding:14px;margin:7px 0;border-radius:14px;border:1px solid var(--line);background:#111419;color:#fff}.option.correct{border-color:#6d923e;background:#14200f}.option.wrong{border-color:#91464c;background:#241416}.explain{border-left:3px solid var(--accent);padding:12px 14px;background:#11170f;border-radius:8px;margin-top:14px;color:#d8ded1;line-height:1.45}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#1b2117;color:var(--accent);font-size:11px;font-weight:800}.warn{color:#ffd16a;font-size:13px}.error{color:var(--danger);font-size:13px}.list{display:grid;gap:10px}.item{padding:14px;border:1px solid var(--line);border-radius:14px;background:#101216}.item small{display:block;color:var(--muted);margin-top:4px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.boot{max-width:560px;margin:0 auto;padding:42px 20px}.boot-box{margin-top:22px;border:1px solid #252a31;background:#111419;border-radius:18px;padding:18px}.boot .brand{font-size:34px}@media(max-width:390px){.wrap{padding-left:14px;padding-right:14px}.roles,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="boot"><div class="brand">BALI</div><div class="sub">ACADEMY • iPhone</div><div class="boot-box">Запуск приложения…</div></div></div>
<script>
(function(){
'use strict';
const app=document.getElementById('app');
const state={role:localStorage.getItem('bali.role')||'bartender',fio:localStorage.getItem('bali.fio')||'',gateway:localStorage.getItem('bali.gateway')||'',token:localStorage.getItem('bali.token')||'',content:null,quiz:null};
const roleName=r=>r==='bartender'?'БАРМЕН':'ОФИЦИАНТ';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const uid=()=>globalThis.crypto?.randomUUID?.()||('bali-'+Date.now()+'-'+Math.random().toString(16).slice(2));
function fatal(text){app.innerHTML=`<div class="boot"><div class="brand">BALI</div><div class="sub">ACADEMY</div><div class="boot-box"><b>Не удалось запустить приложение</b><p class="error">${esc(text)}</p><button class="primary" onclick="location.reload()">ПОВТОРИТЬ</button></div></div>`}
window.addEventListener('error',e=>{if(!app.querySelector('.wrap')) fatal(e.message||'Ошибка JavaScript')});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason)});
async function loadContent(){if(state.content)return state.content;const base='../content/';try{const [k,c]=await Promise.all([fetch(base+'knowledge.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('knowledge.json: HTTP '+r.status);return r.json()}),fetch(base+'cocktails-extra.json',{cache:'no-store'}).then(r=>r.ok?r.json():({cocktails:[]})).catch(()=>({cocktails:[]}))]);state.content={...k,cocktails:[...(k.cocktails||[]),...(c.cocktails||[])]};return state.content}catch(e){throw new Error('База знаний не загрузилась: '+e.message)}}
async function api(path,opts={}){if(!state.gateway)throw new Error('Gateway не настроен');const headers={'Content-Type':'application/json',...(opts.headers||{})};if(state.token)headers.Authorization='Bearer '+state.token;const r=await fetch(state.gateway.replace(/\/$/,'')+path,{...opts,headers});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status));return r.json()}
function shell(body,active='home'){app.innerHTML=`<div class="wrap"><div class="topline"><div><div class="brand">BALI</div><div class="sub">ACADEMY • ${roleName(state.role)}</div></div><button class="ghost" onclick="BALI.settings()">⚙︎</button></div>${body}</div><nav class="nav"><button class="${active==='home'?'active':''}" onclick="BALI.home()">Главная</button><button class="${active==='learn'?'active':''}" onclick="BALI.learn()">База</button><button class="${active==='quiz'?'active':''}" onclick="BALI.quizSetup()">Тест</button><button class="${active==='ai'?'active':''}" onclick="BALI.aiView()">AI</button></nav>`}
function onboarding(){app.innerHTML=`<div class="wrap"><div class="brand">BALI</div><div class="sub">ACADEMY • iPhone</div><h1>Обучение персонала</h1><p class="muted">Введите ФИО и выберите должность.</p><div class="card"><div class="field"><label>ФИО</label><input id="fio" autocomplete="name" value="${esc(state.fio)}" placeholder="Иванов Иван Иванович"></div><div class="field"><label>ДОЛЖНОСТЬ</label><div class="roles"><button id="rb" class="role ${state.role==='bartender'?'active':''}" onclick="BALI.pickRole('bartender')"><b>🍸 БАРМЕН</b><span>Продукт • техника • коктейли</span></button><button id="rw" class="role ${state.role==='waiter'?'active':''}" onclick="BALI.pickRole('waiter')"><b>🍽 ОФИЦИАНТ</b><span>Меню • сервис • продажи</span></button></div></div><button class="primary" onclick="BALI.register()">ВОЙТИ В BALI ACADEMY</button><p id="message" class="warn"></p></div></div>`}
function pickRole(r){state.role=r;document.getElementById('rb')?.classList.toggle('active',r==='bartender');document.getElementById('rw')?.classList.toggle('active',r==='waiter')}
function msg(t,cls='warn'){const el=document.getElementById('message');if(el){el.className=cls;el.textContent=t}}
async function register(){const fio=document.getElementById('fio')?.value.trim()||'';if(fio.split(/\s+/).length<2){msg('Введите фамилию и имя полностью','error');return}state.fio=fio;localStorage.setItem('bali.fio',fio);localStorage.setItem('bali.role',state.role);home()}
function home(){if(!state.fio)return onboarding();shell(`<h1>${esc(state.fio)}</h1><p class="muted">${roleName(state.role)} • персональный профиль</p><div class="grid"><div class="tile" onclick="BALI.learn()"><b>${state.role==='bartender'?'Алкоголь и коктейли':'Меню и алкоголь'}</b><span>${state.role==='bartender'?'История, подача, стекло, матчасть':'Ассортимент, сервис и рекомендации'}</span></div><div class="tile" onclick="BALI.quizSetup()"><b>Тестирование</b><span>10 / 20 / 30 / 50 / 100 случайных вопросов</span></div><div class="tile" onclick="BALI.sales()"><b>Психология продаж</b><span>Premium, upsell, работа с возражениями</span></div><div class="tile" onclick="BALI.aiView()"><b>AI‑тренер</b><span>Русские и английские названия, опечатки, подсказки</span></div></div><div class="card"><span class="pill">BALI Academy</span><h2>Режим обучения</h2><p class="muted">База и тесты загружаются из GitHub. Прогресс на этом iPhone сохраняется автоматически.</p></div>`,'home')}
async function learn(){shell('<h1>База знаний</h1><div class="card muted">Загрузка базы…</div>','learn');try{const c=await loadContent();const lessons=(c.lessons||[]).filter(x=>!x.roles||x.roles.includes(state.role));const products=(c.products||[]).slice(0,state.role==='bartender'?80:50);const cocktails=(c.cocktails||[]).slice(0,state.role==='bartender'?40:12);shell(`<h1>База знаний</h1><div class="list">${lessons.map(x=>`<div class="item"><b>${esc(x.title)}</b><small>${esc(x.category||'Обучение')} • уровень ${x.level||1}</small><p>${esc(x.body||'')}</p></div>`).join('')}${products.map(x=>`<div class="item"><b>${esc(x.name)}</b><small>${esc(x.category||x.subcategory||'Меню')}</small><p>${esc(x.short||x.description||x.bartender||'')}</p></div>`).join('')}${cocktails.map(x=>`<div class="item"><b>${esc(x.name)}</b><small>${esc((x.aliases||[]).join(' • '))}</small><p>${esc(x.method||x.note||'')}</p></div>`).join('')}</div>`,'learn')}catch(e){shell(`<h1>База знаний</h1><div class="card"><b>Ошибка загрузки</b><p class="error">${esc(e.message)}</p><button class="primary" onclick="BALI.learn()">ПОВТОРИТЬ</button></div>`,'learn')}}
async function sales(){shell('<h1>Продажи</h1><div class="card muted">Загрузка…</div>','learn');try{const c=await loadContent();const l=(c.lessons||[]).filter(x=>/продаж|upsell|premium/i.test((x.category||'')+' '+(x.title||'')));shell(`<h1>Продажи</h1><p class="muted">Практика продажи дорогого алкоголя и работа с гостем.</p><div class="list">${l.map(x=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.body||'')}</p></div>`).join('')||'<div class="item">Материалы будут расширяться администратором.</div>'}</div>`,'learn')}catch(e){shell(`<h1>Продажи</h1><div class="card error">${esc(e.message)}</div>`,'learn')}}
async function quizSetup(){shell('<h1>Тестирование</h1><div class="card muted">Загрузка вопросов…</div>','quiz');try{const c=await loadContent();const q=(c.tests||[]).filter(x=>(!x.roles||x.roles.includes(state.role))&&x.type==='single');if(!q.length)throw new Error('В базе пока нет вопросов для этой должности');const cats=[...new Set(q.map(x=>x.category).filter(Boolean))];shell(`<h1>Тестирование</h1><div class="card"><div class="field"><label>КОЛИЧЕСТВО</label><select id="qc"><option>10</option><option>20</option><option>30</option><option>50</option><option>100</option></select></div><div class="field"><label>КАТЕГОРИЯ</label><select id="qcat"><option>Все</option>${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>УРОВЕНЬ</label><select id="ql"><option value="0">Все уровни</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div><button class="primary" onclick="BALI.startQuiz()">НАЧАТЬ</button></div>`,'quiz')}catch(e){shell(`<h1>Тестирование</h1><div class="card error">${esc(e.message)}</div>`,'quiz')}}
async function startQuiz(){const c=await loadContent();const count=+(document.getElementById('qc')?.value||10),cat=document.getElementById('qcat')?.value||'Все',level=+(document.getElementById('ql')?.value||0);let pool=(c.tests||[]).filter(x=>x.type==='single'&&(!x.roles||x.roles.includes(state.role))&&(cat==='Все'||x.category===cat)&&(!level||x.level===level));pool=pool.sort(()=>Math.random()-.5).slice(0,Math.min(count,pool.length));state.quiz={items:pool,index:0,correct:0,errors:[],answers:[],startedAt:new Date().toISOString(),category:cat,level};renderQuestion()}
function renderQuestion(){const z=state.quiz;if(!z||z.index>=z.items.length)return finishQuiz();const q=z.items[z.index];const opts=q.options.map((v,i)=>({v,i})).sort(()=>Math.random()-.5);z.currentOrder=opts;shell(`<div class="topline"><span class="pill">${z.index+1} / ${z.items.length}</span><span class="muted">${esc(q.category||'')}</span></div><h1 class="question">${esc(q.question)}</h1><div id="options">${opts.map((o,n)=>`<button class="option" onclick="BALI.answer(${n})">${esc(o.v)}</button>`).join('')}</div><div id="feedback"></div>`,'quiz')}
function answer(n){const z=state.quiz,q=z.items[z.index],picked=z.currentOrder[n],correctIndexes=Array.isArray(q.correct)?q.correct:[q.correct],ok=correctIndexes.includes(picked.i);if(ok)z.correct++;else z.errors.push({questionId:q.id,topic:q.category,selected:picked.v,correct:correctIndexes.map(i=>q.options[i]).join(', ')});z.answers.push({questionId:q.id,correct:ok});document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;const original=z.currentOrder[i].i;if(correctIndexes.includes(original))b.classList.add('correct');else if(i===n&&!ok)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="explain"><b>${ok?'Правильно':'Неправильно'}</b><br>${esc(q.explanation||'')}${!ok?`<br><br><b>Правильный ответ:</b> ${esc(correctIndexes.map(i=>q.options[i]).join(', '))}`:''}</div><button class="primary" style="margin-top:14px" onclick="BALI.nextQ()">ДАЛЬШЕ</button>`}
function nextQ(){state.quiz.index++;renderQuestion()}
async function finishQuiz(){const z=state.quiz,total=z.items.length,percent=total?Math.round(z.correct/total*100):0;const payload={id:uid(),mode:'mobileconfig-web',role:state.role,fio:state.fio,category:z.category,level:z.level,total,correct:z.correct,percent,errors:z.errors,answers:z.answers,startedAt:z.startedAt,completedAt:new Date().toISOString()};localStorage.setItem('bali.lastResult',JSON.stringify(payload));let sync='Сохранено на iPhone';if(state.gateway&&state.token){try{await api('/api/result',{method:'POST',body:JSON.stringify(payload)});sync='Отправлено администратору'}catch(e){sync='Локально сохранено; синхронизация недоступна'}}shell(`<h1>Результат</h1><div class="card"><div class="score">${percent}%</div><p>${z.correct} из ${total} правильных</p><p class="muted">${esc(sync)}</p></div>${z.errors.length?`<h2>Ошибки</h2><div class="list">${z.errors.map(e=>`<div class="item"><b>${esc(e.topic||'Вопрос')}</b><p>Ваш ответ: ${esc(e.selected)}<br><strong>Правильно: ${esc(e.correct)}</strong></p></div>`).join('')}</div>`:'<div class="card">Ошибок нет 🎉</div>'}<button class="primary" onclick="BALI.quizSetup()">ПЕРЕСДАТЬ</button>`,'quiz')}
function aiView(){shell(`<h1>AI‑тренер</h1><div class="card"><p class="muted">Можно писать по‑русски, по‑английски и с опечатками.</p><div class="field"><textarea id="aim" rows="5" placeholder="Например: как правильно подать Macallan? Как приготовить Long Island?"></textarea></div><button class="primary" onclick="BALI.askAI()">СПРОСИТЬ</button><div id="aires"></div></div>`,'ai')}
async function askAI(){const t=document.getElementById('aim')?.value.trim();if(!t)return;const box=document.getElementById('aires');box.innerHTML='<p class="muted">Поиск…</p>';try{if(state.gateway&&state.token){const d=await api('/api/ai',{method:'POST',body:JSON.stringify({message:t,mode:'trainer'})});box.innerHTML=`<div class="explain">${esc(d.text||d.message||'')}</div>`;return}const c=await loadContent();const norm=s=>String(s||'').toLowerCase().replace(/[^a-zа-яё0-9]/gi,'');const q=norm(t),all=[...(c.cocktails||[]),...(c.products||[])];const hits=all.filter(x=>[x.name,...(x.aliases||[])].some(n=>{const a=norm(n);return a&&(q.includes(a.slice(0,Math.max(4,Math.min(a.length,8))))||a.includes(q.slice(0,Math.max(4,Math.min(q.length,8)))))})).slice(0,8);box.innerHTML=`<div class="explain">${hits.length?'Нашёл:<br>'+hits.map(x=>'• '+esc(x.name)).join('<br>'):'Совпадений в локальной базе не найдено.'}</div>`}catch(e){box.innerHTML=`<p class="error">${esc(e.message)}</p>`}}
function settings(){const last=JSON.parse(localStorage.getItem('bali.lastResult')||'null');shell(`<h1>Настройки</h1><div class="card"><b>${esc(state.fio)}</b><p class="muted">${roleName(state.role)}</p>${last?`<p>Последний тест: <b>${last.percent}%</b></p>`:''}<button class="ghost" onclick="BALI.logout()">Сменить сотрудника</button></div><div class="card"><div class="field"><label>GATEWAY URL <span class="muted">необязательно</span></label><input id="sg" value="${esc(state.gateway)}" placeholder="https://...vercel.app"></div><button class="primary" onclick="BALI.saveGateway()">СОХРАНИТЬ</button></div>`,'home')}
function saveGateway(){state.gateway=(document.getElementById('sg')?.value||'').trim().replace(/\/$/,'');localStorage.setItem('bali.gateway',state.gateway);state.token='';localStorage.removeItem('bali.token');home()}
function logout(){state.fio='';state.token='';localStorage.removeItem('bali.fio');localStorage.removeItem('bali.token');onboarding()}
window.BALI={home,onboarding,pickRole,register,learn,sales,quizSetup,startQuiz,answer,nextQ,aiView,askAI,settings,saveGateway,logout};
try{state.fio?home():onboarding()}catch(e){fatal(e.message||String(e))}
})();
</script>
</body>
</html>
