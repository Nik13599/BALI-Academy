name: BALIStaff
options:
  bundleIdPrefix: com.bali.academy
  deploymentTarget:
    iOS: "17.0"
targets:
  BALIStaff:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bali.academy.staff
        PRODUCT_NAME: BALI Staff
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BALI Staff
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_BALI_GATEWAY_URL: https://YOUR-GATEWAY.vercel.app
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
